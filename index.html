<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Назначение Смен — VK Mini App</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- VK Bridge — позволяет приложению взаимодействовать с ВК (друзья, уведомления и т.д.) -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge@latest/dist/vk-bridge.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="header">Назначение Смен</header>

    <nav class="tabs">
      <button class="tab tab--active" data-tab="schedule">График</button>
      <button class="tab" data-tab="stats">Статистика</button>
    </nav>

    <section class="page page--schedule" id="page-schedule">
      <div class="toolbar">
        <button class="btn btn--outline btn--small" id="btn-prev-week">&lt; Неделя</button>
        <span class="toolbar__week" id="lbl-week"></span>
        <button class="btn btn--outline btn--small" id="btn-next-week">Неделя &gt;</button>
      </div>

      <div class="card">
        <div class="card__title">Добавить смену</div>
        <form id="form-shift" class="form">
          <div class="form__row">
            <label class="form__label">Сотрудник</label>
            <div class="input-wrap">
              <input type="text" id="inp-employee" class="input" list="employees-list" placeholder="Имя сотрудника" />
              <button type="button" class="btn-icon" id="btn-pick-employee" title="Выбрать из друзей ВК">👥</button>
            </div>
            <datalist id="employees-list"></datalist>
            <div class="hint" id="hint-vk-friends"></div>
          </div>

          <div class="form__row">
            <label class="form__label">Точка магазина</label>
            <input type="text" id="inp-store" class="input" list="stores-list" placeholder="Название точки (запомнится)" />
            <datalist id="stores-list"></datalist>
          </div>

          <div class="form__row grid-2">
            <div>
              <label class="form__label">Дата</label>
              <input type="date" id="inp-date" class="input" />
            </div>
            <div>
              <label class="form__label">Время</label>
              <input type="time" id="inp-time" class="input" />
            </div>
          </div>

          <div class="form__row">
            <div>
              <label class="form__label">Длительность (ч)</label>
              <input type="number" id="inp-duration" class="input input--small" min="0.5" step="0.5" value="8" />
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--full">Добавить смену</button>
        </form>
      </div>

      <div class="card">
        <div class="card__title">График на неделю</div>
        <div id="list-week" class="shift-list"></div>
      </div>

      <div class="footer-actions">
        <button class="btn btn--primary btn--full" id="btn-broadcast">Отправить рассылку сотрудникам</button>
        <div class="hint" style="text-align:center">Каждому сотруднику отправляется только его график. Смену можно добавить в календарь телефона.</div>
      </div>
    </section>

    <section class="page hidden" id="page-stats">
      <div class="toolbar">
        <span class="toolbar__week" id="lbl-month"></span>
      </div>
      <div id="list-stats" class="stats-list"></div>
    </section>

    <button class="fab" id="btn-add-shift" title="Быстро перейти к форме">+</button>

    <!-- Оверлей и модальное окно -->
    <div class="overlay hidden" id="overlay"></div>
    <div class="modal hidden" id="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title"></h2>
        <button class="btn-close" id="btn-modal-close">✕</button>
      </div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__footer" id="modal-footer"></div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
